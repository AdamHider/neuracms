type: page
title: Главная
order: 0
published: true
show_in_menu: true
layout:
  sections:
    - settings: {global: site-header}
    - rows:
        - columns:
            - width: 8
              blocks:
                - type: heading
                  settings: {text: 'Чай и Кофе', level: h1}
                - type: text
                  settings:
                    body: 'Свежая обжарка и листовой чай с доставкой по городу.'
            - width: 4
              blocks:
                - type: button
                  settings: {text: 'Весь каталог', url: /catalog, style: outline}
        - columns:
            - width: 12
              blocks:
                - type: heading
                  settings: {text: 'Хиты продаж', level: h2}
                - type: elements
                  settings:
                    element_type: product
                    limit: 3
                    sort: order
                    direction: asc
                    map_title: title
                    map_price: price
                    columns: '3'
    - settings: {global: site-footer}
